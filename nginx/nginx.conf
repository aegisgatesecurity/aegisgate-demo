# AegisGate Demo - Nginx Reverse Proxy Configuration
# =====================================================
#
# This nginx config sits in front of the AegisGate platform to:
#   1. Serve the email signup page at /
#   2. Proxy /signup/* to the Python signup server (port 8083)
#   3. Proxy /platform/* to the AegisGate platform (port 8080)
#   4. Proxy /dashboard/* to the admin dashboard (port 8443, read-only in demo)
#   5. Inject the DEMO MODE banner into every page (sub_filter)
#   6. Add demo-specific security headers
#
# Run with:
#   docker run -d -p 80:80 -p 443:443 \
#     -v /opt/aegisgate-demo/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v /opt/aegisgate-demo/scripts/demo-banner.css:/etc/nginx/demo-banner.css:ro \
#     -v /opt/aegisgate-demo/scripts/demo-banner.js:/etc/nginx/demo-banner.js:ro \
#     nginx:alpine

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ============================================
    # Basic settings
    # ============================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ============================================
    # Logging
    # ============================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ============================================
    # Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ============================================
    # Security headers (demo-specific)
    # ============================================
    # Note: We're a demo, so we can be a bit more relaxed,
    # but we still want to set good defaults.

    # ============================================
    # Upstream definitions
    # ============================================
    upstream aegisgate_platform {
        server 127.0.0.1:8080;
    }
    upstream aegisgate_dashboard {
        server 127.0.0.1:8443;
    }
    upstream aegisgate_signup {
        server 127.0.0.1:8083;
    }

    # ============================================
    # Access cookie map (demo gate)
    # ============================================
    # Maps the aegisgate_demo_access cookie to a $has_access variable.
    # signup.py sets this cookie (24h, HttpOnly, SameSite=Lax) on
    # successful signup. The location blocks for /dashboard/, /seed-data/,
    # and /platform/ check $has_access and redirect to / if the user
    # has not signed up.
    map $cookie_aegisgate_demo_access $has_access {
        default 0;
        1       1;
    }

    # ============================================
    # Rate limiting (demo-specific)
    # ============================================
    # Generous limits for the demo, but with some protection
    limit_req_zone $binary_remote_addr zone=demo_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=demo_signup:1m rate=2r/m;  # 2 signups/min per IP

    # ============================================
    # Default server
    # ============================================
    server {
        # Listen on 8080 (Render's default port, prevents port detection issues)
        # Why 8080? Render's port detection is unreliable with multiple EXPOSE
        # directives. By using 8080 (a well-known web port), Render can
        # definitively route traffic to nginx instead of the platform binary.
        listen 8080 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Note: For a demo, we don't set a strict CSP because
        # we're injecting content via sub_filter. If you want a
        # strict CSP, you can add it here and update the sub_filter
        # whitelist accordingly.

        # Rate limit (per IP)
        limit_req zone=demo_per_ip burst=20 nodelay;

        # ============================================
        # Email signup pages
        # ============================================
        location /signup/ {
            limit_req zone=demo_signup burst=5 nodelay;
            proxy_pass http://aegisgate_signup/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ============================================
        # Dashboard (static demo UI)
        # ============================================
        # Serves the self-contained demo dashboard from
        # /opt/aegisgate-demo/dashboard/. This is what users
        # see after they sign up (or visit the root URL).
        # The dashboard fetches seed JSON from /seed-data/.
        # Gate /dashboard/ behind the signup cookie.
        # If the user has not signed up, redirect them to / (signup form).
        location /dashboard/ {
            if ($has_access = 0) { return 302 https://demo.aegisgatesecurity.io/; }
            alias /opt/aegisgate-demo/dashboard/;
            index index.html;
            try_files $uri $uri/ /dashboard/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # ============================================
        # Seed data (static JSON for the dashboard)
        # ============================================
        # Serves the demo's pre-loaded JSON files. The dashboard
        # fetches these directly (no API). CORS-friendly for
        # local development, no caching so updates take effect.
        # Gate /seed-data/ behind the signup cookie.
        # Otherwise users could fetch the JSON directly without signing up.
        location /seed-data/ {
            if ($has_access = 0) { return 302 https://demo.aegisgatesecurity.io/; }
            alias /opt/aegisgate-demo/seed-data/;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /signup/submit {
            limit_req zone=demo_signup burst=5 nodelay;
            proxy_pass http://aegisgate_signup/signup/submit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================
        # Landing page (email signup form)
        # ============================================
        location = / {
            proxy_pass http://aegisgate_signup/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================
        # AegisGate dashboard (port 8443)
        # ============================================
        # After signup, users are redirected to /platform/
        # which proxies to the platform's admin dashboard
        #
        # NOTE: The platform has two HTTP services:
        #   - 8080 (proxy): forwards traffic to the target (httpbin.org in demo mode)
        #   - 8443 (dashboard): the actual AegisGate admin UI
        # In demo mode, hitting port 8080 shows httpbin.org's UI (the target).
        # We want users to see the AegisGate platform UI, so we proxy to 8443.
        # IMPORTANT: proxy_pass WITHOUT trailing slash preserves the /platform/
        # prefix when forwarding. With trailing slash, nginx would strip it.
        # E.g., /platform/ui -> /platform/ui (preserved) instead of /ui (stripped).
        # Gate /platform/ behind the signup cookie.
        location /platform/ {
            if ($has_access = 0) { return 302 https://demo.aegisgatesecurity.io/; }
            proxy_pass http://aegisgate_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Inject the DEMO MODE banner into every response
            sub_filter '</body>' '<link rel="stylesheet" href="/__demo__/demo-banner.css"><script src="/__demo__/demo-banner.js"></script></body>';
            sub_filter_once off;
        }

        # NOTE: An earlier (pre-dashboard) version of this config had a
        # `location = /dashboard/ { return 302 https://.../platform/ui/; }`
        # block here, which sent /dashboard/ to the broken /platform/ui/
        # 404 page. That block was REMOVED in 5d52b08 / the actual fix commit
        # (the static-files block above at the `location /dashboard/` prefix
        # match now serves /dashboard/ directly). Keeping this comment as a
        # historical marker so future maintainers do not re-add the redirect.

        # Health check (for Render.com)
        # Render requires /health to return 200 OK for the service to be
        # considered "Live". Rather than proxying to the platform (which
        # returns 503 during startup), we return 200 directly from nginx.
        # This means Render considers the service healthy as long as nginx
        # is running, even if the platform is still initializing.
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"aegisgate-demo","timestamp":"$time_iso8601"}';
        }

        # ============================================
        # Demo assets (banner CSS/JS)
        # ============================================
        location /__demo__/ {
            alias /etc/nginx/;
            add_header Cache-Control "public, max-age=3600";
        }

        # ============================================
        # Everything else → platform
        # ============================================
        location / {
            proxy_pass http://aegisgate_platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            sub_filter '</body>' '<link rel="stylesheet" href="/__demo__/demo-banner.css"><script src="/__demo__/demo-banner.js"></script></body>';
            sub_filter_once off;
        }
    }
}
