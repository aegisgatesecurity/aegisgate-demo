# AegisGate Demo - Render.com Blueprint
# ==========================================
#
# This file declares the demo environment for Render.com's
# "Infrastructure as Code" (Blueprints) feature.
#
# How it works:
#   1. Sign in to Render.com with GitHub
#   2. New + → Blueprint
#   3. Select this repo (aegisgate-demo)
#   4. Render reads this file and provisions the services
#   5. Add custom domain: demo.aegisgatesecurity.io
#   6. Render auto-provisions Let's Encrypt SSL
#
# Docs: https://docs.render.com/blueprint-spec
# Schema: https://render.com/schema/render.yaml.json
# (validated against the official JSON Schema)

# IMPORTANT: The Blueprint spec requires a top-level 'version' field
# (must be "1" exactly). Without it, the schema rejects the file.
version: "1"

services:
  # ============================================
  # AegisGate Demo Platform (Web Service)
  # ============================================
  - type: web
    name: aegisgate-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    # NOTE: Removed 'startCommand' — Render's error said:
    #   'docker runtime must not have startCommand'
    # For Docker services, Render uses dockerCommand OR the Dockerfile's
    # CMD/ENTRYPOINT. Our Dockerfile.demo has ENTRYPOINT set, so Render
    # will use that. See: https://docs.render.com/blueprint-spec
    plan: free  # Free tier: sleeps after 15min inactivity, 750 hrs/mo
    region: oregon
    branch: main
    autoDeploy: true  # Re-deploy on every push to main
    healthCheckPath: /health
    # NOTE: Render's current Blueprint spec (verified against
    # https://render.com/schema/render.yaml.json) does NOT have a
    # 'port' field — Render auto-detects the public port from the
    # Docker container's EXPOSE directive. Our Dockerfile.demo
    # exposes port 80 (nginx reverse proxy).
    envVars:
      # === Demo mode configuration ===
      - key: AEGISGATE_MODE
        value: demo
      - key: AEGISGATE_DEMO_RESET_HOURS
        value: 24
      - key: AEGISGATE_DEMO_MAX_REQUESTS_PER_HOUR
        value: 100
      - key: AEGISGATE_DEMO_RANDOM_SEED
        value: aegisgate-demo-2026-06
      # === Platform configuration ===
      - key: AEGISGATE_LOG_LEVEL
        value: info
      - key: AEGISGATE_TIER
        value: developer
      - key: AEGISGATE_TARGET
        value: http://httpbin.org:80
      - key: AEGISGATE_EMBEDDED_MCP
        value: "true"
      # === Email signup (set this to forward signups to your email service) ===
      # Get a free webhook at https://webhook.site or use Mailgun/SendGrid
      - key: EMAIL_WEBHOOK_URL
        sync: false  # Set this in the Render dashboard (not committed)
      # === Cloudflare Turnstile (anti-bot, optional) ===
      - key: CF_TURNSTILE_SITE_KEY
        sync: false
      - key: CF_TURNSTILE_SECRET_KEY
        sync: false
    # Custom domain (auto-provisions SSL)
    # Per the official Render Blueprint spec at
    # https://render.com/schema/render.yaml.json:
    #   domain:  (string) for a single custom domain
    #   domains: (array of strings) for multiple custom domains
    # The error "field customDomains not found in type file.Service"
    # came from using the WRONG field name. The correct name is
    # "domain" (singular) as a string.
    domain: demo.aegisgatesecurity.io
    # NOTE: Removed the 'disk' field — Render's error said:
    #   'disks are not supported for free tier services'
    # Persistent disks require a paid plan ($7/mo for starter).
    # For the free tier, the seed data is loaded from the Docker image
    # on every container startup, and the signup CSV is ephemeral
    # (regenerated on every restart, which happens every ~15min anyway
    # when the service sleeps).
    #
    # The entrypoint script still works — it just doesn't have a /data
    # directory to persist to. We use a tmpfs-backed /data instead.
    #
    # When the user upgrades to a paid plan, they can add:
    #   disk:
    #     name: demo-data
    #     mountPath: /data
    #     sizeGB: 1
    # NOTE: Removed the 'scaling' field because the Render Blueprint
    # schema requires minInstances: >= 1. We wanted minInstances: 0 to
    # allow the service to scale to zero on the free tier (which sleeps
    # after 15min), but the schema doesn't allow 0. The free tier
    # sleeps automatically by default, so we don't need explicit scaling.
    # If we want explicit scaling, we need to upgrade to a paid plan
    # where minInstances: 1 is acceptable.
